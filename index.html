<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#050510" />
    <title>Space Samurai</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="prompt"></div>
        <div id="stamina-wrap"><div id="stamina"></div></div>
        <div id="lock-reticle" hidden></div>
        <div id="mode-badge">DOJO</div>
        <div id="help">WASD move · Mouse look · LMB light · RMB heavy · Space dodge · Q lock · E interact/board · F fire (ship)</div>
      </div>
      <div id="touch" aria-hidden="true">
        <div id="stick" class="stick"><div id="stick-knob"></div></div>
        <div class="actions">
          <button type="button" data-act="lock">LOCK</button>
          <button type="button" data-act="dodge">DODGE</button>
          <button type="button" data-act="heavy">HEAVY</button>
          <button type="button" data-act="light">LIGHT</button>
          <button type="button" data-act="interact" class="wide">BOARD / USE</button>
          <button type="button" data-act="fire">FIRE</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
